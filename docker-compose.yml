services:
  mysql:
    image: mysql:8.0
    container_name: ipo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ipo_team
      MYSQL_USER: ipo_user
      MYSQL_PASSWORD: ipo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
